name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuilds so /trhy/ picks up fresh prices (fetched at build time by
  # src/_data/markets.js). NYSE trades 9:30–16:00 New York time, which is
  # 14:30–21:00 UTC in winter and 13:30–20:00 UTC in summer. The UTC times
  # below land at least an hour after the open and the close all year.
  # GitHub may start scheduled runs late, sometimes by hours.
  schedule:
    - cron: "7 15 * * 1-5" # after the open, weekdays
    - cron: "7 22 * * *" # after the close; daily so crypto updates on weekends

# Permissions needed for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to the `site` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      # The home server (gk-server) serves this branch: it pulls it every
      # minute. One force-pushed commit, so the branch never grows.
      - name: Publish to the site branch
        run: |
          cd _site
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
